[project]
name = "zoologist"
version = "0.1.0"
description = "Classifying penguins"
readme = "README.md"
authors = [
    { name = "d", email = "diogo.borges@live.com.pt" }
]
requires-python = ">=3.12.9"
dependencies = [
    "pandas<3",
    "scikit-learn>=1.9.1",
]

[project.scripts]
zoologist = "zoologist:main"

[project.optional-dependencies]
dev = [
    "ipykernel>=7.4.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
